<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/til/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This description is duplicated (by necessity — these SEO/social
         tags can't reference another file) in package.json's "description"
         and README.md's opening line, and repeated below in og:description and
         twitter:description. Keep all five in sync by hand. -->
    <meta
      name="description"
      content="til — a running, searchable log of things learned across programming, tech, AI, and how to focus and learn well."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#201a14" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="til" />
    <meta
      property="og:description"
      content="A running, searchable log of things learned across programming, tech, AI, and how to focus and learn well."
    />
    <meta property="og:url" content="https://enbattle.github.io/til/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="til" />
    <meta
      name="twitter:description"
      content="A running, searchable log of things learned across programming, tech, AI, and how to focus and learn well."
    />
    <title>til</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <script>
      // GitHub Pages SPA deep-link redirect (see public/404.html): a hard
      // reload or a shared link to e.g. /til/ai-and-ml/tokens hits 404.html,
      // which encodes the path into `?p=` and reloads here. Decode it back
      // into a real history entry before React Router ever mounts.
      (function () {
        const redirect = sessionStorage.getItem('til-redirect-path');
        if (redirect) {
          sessionStorage.removeItem('til-redirect-path');
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
