name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's patch and minor updates, so
# each one merges by itself once every required status check passes. Major
# updates are left for a person, since they can break things on purpose.
#
# Prerequisite (a repository setting, not code): `main` must require the CI
# `verify` check to pass before merging. Without a required check, GitHub
# merges an auto-merge PR immediately, untested. README.md's "Repository
# settings this relies on" lists it.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
