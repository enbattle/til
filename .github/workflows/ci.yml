name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancels a run still in progress for the same branch/PR when a new commit lands on it — otherwise
# every push to an active PR queues a full run that's obsolete before it even finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this job doesn't push, comment, or write anything — read-only access to
# repo contents is all `actions/checkout` needs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The one definition of the check chain (package.json "verify"), shared with
      # the deploy workflow and every skill, so CI can never drift from it.
      - run: npm run verify
