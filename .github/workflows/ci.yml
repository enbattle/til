name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancels a run still in progress for the same branch/PR when a new commit lands on it — otherwise
# every push to an active PR queues a full run that's obsolete before it even finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this job doesn't push, comment, or write anything — read-only access to
# repo contents is all `actions/checkout` needs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:colors
      - run: npm run check:tokens
      - run: npm run check:contrast
      - run: npm run check:npm-refs
      - run: npm run check:pipeline-log
      - run: npm run check:raw-html
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npm run size
      - run: npm run check:bundle
