name: CI

# Pull requests only: a push to main runs the same `npm run verify` in deploy.yml
# before it deploys, so a CI run on main would repeat that job.
on:
  pull_request:

# Cancels a run still in progress for the same branch/PR when a new commit lands on it — otherwise
# every push to an active PR queues a full run that's obsolete before it even finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this job doesn't push, comment, or write anything — read-only access to
# repo contents is all `actions/checkout` needs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The one definition of the check chain (package.json "verify"), shared with
      # the deploy workflow and the final gate of every skill that changes the repo, so CI can never drift
      # from it.
      - run: npm run verify
