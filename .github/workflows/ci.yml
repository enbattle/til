name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancels a run still in progress for the same branch/PR when a new commit lands on it — otherwise
# every push to an active PR queues a full run that's obsolete before it even finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this job doesn't push, comment, or write anything — read-only access to
# repo contents is all `actions/checkout` needs.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The DSA entries' Python tests (npm run test:py, inside verify) need Python
      # and the pytest version pinned in requirements-dev.txt.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      # The one definition of the check chain (package.json "verify"), shared with
      # the deploy workflow and the /feature, add-topic, add-case-study and
      # add-dsa-entry gates, so CI can never drift from it.
      - run: npm run verify
